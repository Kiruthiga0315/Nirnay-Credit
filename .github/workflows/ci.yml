name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Smoke build
        run: python run_all.py --smoke --keep-going
      # T4: claims gate — metrics.json must contain every key from docs/claims/*.md
      - name: Claims audit (all claimed keys must exist in metrics.json)
        run: pytest tests/test_claims.py -v --tb=short
      - name: Full test suite
        run: pytest --ignore=tests/test_pages_smoke.py --ignore=tests/test_failure_drills.py -q
