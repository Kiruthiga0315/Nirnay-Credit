[project]
name = "ps12"
version = "0.1.0"
description = "Governed MSME lending cockpit (Hackconquest PS12)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs", "demo_snapshot"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is advisory, never block a PR on it

[tool.ruff.lint.per-file-ignores]
"app/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
